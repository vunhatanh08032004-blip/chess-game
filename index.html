<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master - Pro Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            min-height: 100vh;
        }

        .top-controls {
            margin-bottom: 20px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            background: #444;
            color: #ccc;
            border: none;
            border-radius: 4px;
        }

            .mode-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .btn-active {
            background: #007acc !important;
            color: white !important;
        }

        #game-view-container {
            transition: 0.3s;
            filter: grayscale(1);
            opacity: 0.3;
            pointer-events: none;
        }

        .is-active {
            filter: grayscale(0) !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        #main-layout {
            display: flex;
            flex-direction: row; /* Laptop: Ngang */
            flex-wrap: wrap; /* Quan trọng: Để tự động nhảy dòng trên điện thoại */
            justify-content: center;
            gap: 20px;
            background: #262626;
            padding: 15px;
            border-radius: 8px;
            max-width: 100%;
        }

        #game-outer {
            position: relative;
            width: 450px; /* Cho máy tính */
            height: 450px;
            max-width: 95vw; /* Cho điện thoại: không quá 95% chiều ngang */
            max-height: 95vw;
            flex-shrink: 0;
        }

        #board {
            width: 100%;
            height: 100%;
        }

        #side-panel {
            width: min(300px,95vw);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            z-index: 1000;
        }

        .click-cell {
            width: 100%;
            height: 100%;
            cursor: pointer;
            border: 2px solid transparent;
            box-sizing: border-box;
        }

        .border-selected {
            background: rgba(255, 255, 0, 0.4);
            border: 2px solid yellow !important;
        }

        .border-hint {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid lime !important;
        }

        .in-check {
            background: rgba(255, 0, 0, 0.7) !important;
            border: 3px solid red !important;
            animation: blink 0.6s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .info-bar {
            margin: 10px 0;
            padding: 12px;
            background: #111;
            text-align: center;
            color: #00ffcc;
            font-weight: bold;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        #logs {
            height: 335px;
            display: block;
            overflow-y: auto;
            background: #000;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .system-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background: #fff;
            color: #000;
            z-index: 3000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .modal-header {
            background: #0055ea;
            color: #fff;
            padding: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-x {
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 0 5px;
        }

        .modal-body {
            padding: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
        }

        .modal-footer {
            padding: 10px;
            background: #eee;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            background: #0055ea;
            color: white;
            border-radius: 4px;
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2999;
        }

        /* Màu sắc cho Log */
        .log-user {
            color: #ffffff;
        }

        /* Trắng: Người chơi */
        .log-opponent {
            color: #00ccff;
        }

        /* Xanh: Máy/Đối thủ */
        .log-system {
            color: #ffcc00;
        }

        /* Vàng: Hệ thống */
        .log-score {
            color: #ff4444;
        }

        /* Mỗi dòng log là một khối độc lập, luôn bám trái */
        .log-row-sync {
            text-align: left !important;
            margin-bottom: 4px;
            padding: 2px 0;
            border-bottom: 1px solid #333; /* Đường gạch nhẹ cho chuyên nghiệp */
            font-size: 13px;
            width: 100%;
        }

        .log-time-sync {
            color: #888;
            font-family: monospace;
            font-size: 11px;
            margin-right: 8px;
        }

        /* CSS cho Điện thoại */
        @media (max-width: 800px) {

            #main-layout {
                flex-direction: column;
                align-items: center;
                padding: 5px;
            }

            #game-outer {
                width: min(450px,95vw);
                height: min(450px,95vw);
            }

            #side-panel {
                width: 300px;
                max-width: 95vw;
            }

            #logs {
                height: 300px;
                max-height: 40vh;
            }

            .mode-btn {
                padding: 12px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Chứa hai nút chọn chế độ -->
    <div class="top-controls">
        <button class="mode-btn" id="btn-pve" onclick="requestGame('PVE')">NGƯỜI VS MÁY</button>
        <button class="mode-btn" id="btn-pvp" onclick="requestGame('PVP')">NGƯỜI VS NGƯỜI</button>
    </div>

    <!-- Khu vực game -->
    <div id="game-view-container">
        <div id="main-layout">

            <!-- Bàn cờ -->
            <div>
                <div id="game-outer">
                    <div id="board"></div>
                    <div id="click-overlay"></div>
                </div>

                <div class="info-bar">
                    <span id="turn-display">LƯỢT: TRẮNG</span> |
                    <span id="timer-span">30s</span>
                </div>
            </div>

            <!-- Bảng log -->
            <div id="side-panel">
                <div id="logs"></div>

                <button onclick="confirmExit()"
                        style="margin-top:10px;
                        background:#e74c3c;
                        color:white;
                        border:none;
                        padding:12px;
                        cursor:pointer;
                        font-weight:bold;
                        width:100%;
                        border-radius:4px;">
                    THOÁT
                </button>
            </div>

        </div>
    </div>

    <div id="modal-overlay"></div>

    <!-- Modal thông báo -->
    <div id="custom-modal" class="system-modal">
        <div class="modal-header">
            <span id="modal-title">HỆ THỐNG</span>
            <span class="close-x" onclick="closeSystemModal()">&times;</span>
        </div>

        <div class="modal-body" id="modal-msg"></div>

        <div class="modal-footer" id="modal-btns"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        // Cấu hình kết nối đến dự án Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyCJRXRhYXBbc0DiwZg3KXnySGJ63z4Ow2s",
            authDomain: "chessonline-43534.firebaseapp.com",
            databaseURL: "https://chessonline-43534-default-rtdb.firebaseio.com",
            projectId: "chessonline-43534",
            storageBucket: "chessonline-43534.firebasestorage.app",
            messagingSenderId: "194591877060",
            appId: "1:194591877060:web:4d9461cbebfc3184eb2691"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        // Tạo một ID duy nhất cho mỗi người chơi khi truy cập (ví dụ: UID-x8k2j)
        const myId = "UID-" + Math.random().toString(36).substr(2, 5);

        // Khởi tạo các biến logic chính
        var board = null,
            game = new Chess(), // Thư viện chess.js quản lý luật chơi
            selectedSq = null; // Lưu ô cờ đang được nhấn chọn
        var mode = '', myColor = 'w', timer = 30, timerMs = 30000, timerInt = null, isPaused = false;
        var matchmakingTimer = null;
        var aiRecentSquares = [];
        let aiThinking = false;
        let aiThinkID = 0;
        var afkCount = 0; // Đếm số lần bỏ lượt (AFK)
        const MAX_AFK = 3;

        function addLog(msg, type = 'system') {
            const now = new Date();
            const timeStr = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;

            let colorClass = 'log-system';
            if (type === 'user') colorClass = 'log-user';
            if (type === 'opponent') colorClass = 'log-opponent';

            const logHTML = `
                                            <div class="log-row-sync">
                                                <span class="log-time-sync">${timeStr}</span>
                                                <span class="${colorClass}">${msg}</span>
                                            </div>`;

            $('#logs').append(logHTML);

            // Tự động cuộn xuống dưới cùng
            const logBox = document.getElementById('logs');
            if (logBox) logBox.scrollTop = logBox.scrollHeight;
        }

        /*Tạo ra các nút bấm động*/
        function triggerModal(msg, btns, title = "HỆ THỐNG") {
            isPaused = true;
            $('#modal-title').text(title);
            $('#modal-msg').html(msg);
            $('#modal-btns').html(btns.map(x => `<button class="modal-btn" onclick="${x.fn}">${x.txt}</button>`).join(''));
            $('#modal-overlay, #custom-modal').show();
        }

        function closeSystemModal() {
            $('#modal-overlay, #custom-modal').hide();
            if (matchmakingTimer) clearInterval(matchmakingTimer);
            isPaused = false; // Tiếp tục cho phép các logic chạy
            $('#game-view-container').addClass('is-active'); // Hiển thị bàn cờ

            // Nếu game đã bắt đầu (có mode) mà đồng hồ chưa chạy, thì kích hoạt đếm ngược
            if (mode && !timerInt) startCountdown();
        }

        //Thông báo thoát
        function confirmExit() {
            triggerModal("Bạn có thực sự muốn thoát không?", [
                { txt: "Thoát", fn: "exitGame()" },
                { txt: "Ở lại", fn: "closeSystemModal()" }
            ], "XÁC NHẬN");
        }
        function sendMove(move) {
            if (!window.currentRoom) return;
            let roomRef = db.ref('rooms/' + window.currentRoom);
            roomRef.update({
                fen: game.fen(),
                lastMove: move, // Lưu thêm thông tin nước đi cuối để đối thủ dễ theo dõi
                updated: Date.now()
            });
        }

        function requestGame(m) {
            // Hiệu ứng giao diện: Làm mờ tất cả các nút chế độ để tập trung vào lựa chọn hiện tại
            $('.mode-btn').removeClass('btn-active').css({
                'opacity': '0.5',
                'pointer-events': 'auto'
            });

            // Làm sáng rực nút đã chọn và khóa nút đó lại (tránh nhấn liên tục)
            $(`#btn-${m.toLowerCase()}`).addClass('btn-active').css({
                'opacity': '1',
                'pointer-events': 'none'
            });

            if (m === 'PVP') { // Nếu chọn chế độ đấu Người vs Người
                let secondsLeft = 60;
                // Hiển thị một bảng thông báo (Modal) đang tìm đối thủ với đồng hồ đếm ngược 60s
                triggerModal(`Đang tìm đối thủ... <br><span style="font-size:2em; color:#0055ea;" id="mm-countdown">60</span>`, [], "GHÉP TRẬN");

                matchmakingTimer = setInterval(() => {
                    secondsLeft--;
                    $('#mm-countdown').text(secondsLeft);
                    if (secondsLeft <= 0) {
                        clearInterval(matchmakingTimer);
                        triggerModal("Không có đối thủ nào đang chơi!", [{ txt: "Quay lại", fn: "exitGame()" }]);
                    }
                }, 1000);

                // --- Logic Kết nối Firebase ---
                const lobbyRef = db.ref('matchmaking'); // Điểm hẹn chung trên Database
                const myStatusRef = lobbyRef.child(myId); // Đăng ký sự hiện diện của bản thân
                myStatusRef.set({ id: myId, ts: Date.now() });

                // Gửi "nhịp tim" (heartbeat) mỗi 2 giây để báo rằng bạn vẫn đang chờ, tránh bị coi là mất kết nối
                const hb = setInterval(() => myStatusRef.update({ ts: Date.now() }), 2000);
                myStatusRef.onDisconnect().remove(); // Nếu đóng trình duyệt, tự động xóa tên khỏi hàng chờ

                // Kiểm tra xem có ai khác đang đợi không
                lobbyRef.once('value', (snap) => {
                    let found = false;
                    snap.forEach((child) => {
                        const peer = child.val();
                        // Nếu tìm thấy người khác và họ vẫn online (trong 10s qua)
                        if (peer.id !== myId && (Date.now() - peer.ts < 10000)) {
                            found = true;
                            db.ref('rooms/' + peer.id).update({ p2: myId });

                            clearInterval(hb);
                            clearInterval(matchmakingTimer);
                            myColor = 'b';
                            triggerModal("Đã tìm thấy đối thủ!", [{ txt: "Bắt đầu ngay", fn: "startGamePVP('" + peer.id + "')" }]);
                        }
                    });

                    if (!found) {
                        // Nếu không tìm thấy ai, mình sẽ là chủ phòng
                        db.ref('rooms/' + myId).on('value', s => {
                            const roomData = s.val();
                            if (roomData && roomData.p2) {
                                clearInterval(hb);
                                clearInterval(matchmakingTimer);
                                db.ref('rooms/' + myId).off();
                                myColor = 'w';
                                triggerModal("Đã tìm thấy đối thủ!", [{ txt: "Bắt đầu ngay", fn: "startGamePVP('" + myId + "')" }]);
                            }
                        });
                    }
                });
            } else {
                // Nếu chọn PVE (Máy), chỉ cần gọi hàm khởi tạo game cục bộ
                triggerModal("Bắt đầu chế độ người với máy", [{ txt: "Bắt đầu", fn: "initGame('PVE')" }]);
            }
        }

        function startGamePVP(roomId) {
            window.currentRoom = roomId; // Lưu ID phòng vào biến toàn cục
            let lastUpdate = 0;
            let lastAfkTs = 0;

            // Lắng nghe sự thay đổi của bàn cờ trên Firebase
            db.ref('rooms/' + roomId).on('value', snap => {

                const data = snap.val();
                if (!data) return;

                // KIỂM TRA TRẠNG THÁI KẾT THÚC (AFK hoặc lý do khác từ đối thủ)
                if (data.gameOver && !isPaused) {
                    clearInterval(timerInt);
                    addLog(`HỆ THỐNG: ${data.reason}`, 'system');
                    triggerModal(data.reason, [{ txt: "Quay lại", fn: "exitGame()" }], "KẾT THÚC");
                    return;
                }

                if (data.updated === lastUpdate) return;
                lastUpdate = data.updated;

                // Nếu server có nước đi mới
                if (data.fen !== game.fen()) {

                    let oldFen = game.fen();

                    // Tạo game tạm để tìm nước đi
                    let tempGame = new Chess(oldFen);
                    let moves = tempGame.moves({ verbose: true });

                    let foundMove = null;

                    for (let m of moves) {
                        tempGame.move(m);
                        if (tempGame.fen() === data.fen) {
                            foundMove = m;
                            break;
                        }
                        tempGame.undo();
                    }

                    // Cập nhật bàn cờ
                    game.load(data.fen);
                    board.position(data.fen);

                    // Nếu tìm được nước đi → ghi log
                    if (foundMove) {

                        const pieceNames = {
                            p: "Tốt",
                            n: "Mã",
                            b: "Tượng",
                            r: "Xe",
                            q: "Hậu",
                            k: "Vua"
                        };

                        let pName = pieceNames[foundMove.piece];
                        let color = foundMove.color === 'w' ? "TRẮNG" : "ĐEN";

                        let msg = `<b>[${color}]</b> ${pName} ${foundMove.from}→${foundMove.to}`;

                        if (foundMove.captured) {
                            msg += ` <span style="color:#ff4444;">(Ăn ${pieceNames[foundMove.captured]})</span>`;
                        }

                        addLog(msg, "opponent");

                        if (foundMove.flags.includes('p')) { // 'p' là cờ báo hiệu promotion trong chess.js
                            const promoPiece = pieceNames[foundMove.promotion] || "Hậu";
                            addLog(`HỆ THỐNG: TỐT [${color}] TẠI ${foundMove.to} ĐÃ PHONG ${promoPiece.toUpperCase()}`, 'system');
                        }


                    }
                    startCountdown();
                    refreshStatus();
                }
            });

            initGame('PVP'); // Khởi tạo các thông số game ban đầu
        }

        // Bảng vị trí giúp quân Mã và Tượng thích nhảy vào giữa để bao vây
        const centerControl = [
            [-20, -10, -10, -10, -10, -10, -10, -20],
            [-10, 5, 5, 5, 5, 5, 5, -10],
            [-10, 5, 10, 10, 10, 10, 5, -10],
            [-10, 5, 10, 20, 20, 10, 5, -10],
            [-10, 5, 10, 20, 20, 10, 5, -10],
            [-10, 5, 10, 10, 10, 10, 5, -10],
            [-10, 5, 5, 5, 5, 5, 5, -10],
            [-20, -10, -10, -10, -10, -10, -10, -20]
        ];

        // Giá trị quân cờ: Tăng dần từ quân tốt đến quân quan trọng nhất
        const pieceValues = {
            p: 100,   // Tốt (Vòng ngoài)
            n: 350,   // Mã
            b: 360,   // Tượng
            r: 550,   // Xe
            q: 1000,  // Hậu (Vòng trong)
            k: 50000  // Tướng (Cao nhất)
        };

        const transTable = {};

        const openingBook = {

            // position ban đầu
            "start": ["e4", "d4", "c4", "Nf3"],

            // sau e4
            "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1":
                ["c5", "e5", "e6", "c6"],

            // sau d4
            "rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq - 0 1":
                ["d5", "Nf6", "e6"]

        };

        function getOpeningMove(g) {

            let fen = g.fen().split(" ").slice(0, 4).join(" ");

            // position ban đầu
            if (g.history().length === 0) {
                let list = openingBook["start"];
                return list[Math.floor(Math.random() * list.length)];
            }

            if (openingBook[fen]) {
                let list = openingBook[fen];
                return list[Math.floor(Math.random() * list.length)];
            }

            return null;
        }

        function minimax(g, depth, alpha, beta) {

            let key = fastHash(g, depth);

            if (transTable[key] && transTable[key].depth >= depth) {
                return transTable[key].score;
            }

            if (depth === 0)
                return quiescence(g, alpha, beta);

            if (Object.keys(transTable).length > 20000) {
                transTable = {};
            }

            let moves = g.moves({ verbose: true });

            let best = -Infinity;

            for (let m of moves) {

                g.move(m);

                let score = -minimax(g, depth - 1, -beta, -alpha);

                g.undo();

                if (score > best)
                    best = score;

                if (score > alpha)
                    alpha = score;

                if (alpha >= beta)
                    break;
            }

            transTable[key] = {
                score: best,
                depth: depth
            };

            return best;
        }

        function evaluateBoard(g) {

            if (g.in_checkmate()) {
                return g.turn() === 'w' ? -100000 : 100000;
            }

            let totalScore = 0;
            const board = g.board();

            const aiColor = (myColor === 'w') ? 'b' : 'w';

            for (let i = 0; i < 8; i++) {

                for (let j = 0; j < 8; j++) {

                    const piece = board[i][j];

                    if (!piece) continue;

                    let val = pieceValues[piece.type] || 0;

                    // center control
                    if (piece.type === 'n' || piece.type === 'b' || piece.type === 'q') {
                        val += centerControl[i][j];
                    }

                    // pawn advance
                    if (piece.type === 'p') {

                        if (piece.color === 'b')
                            val += i * 8;
                        else
                            val += (7 - i) * 8;

                    }

                    if (piece.color === aiColor)
                        totalScore += val;
                    else
                        totalScore -= val;

                }

            }

            totalScore += evaluateMobility(g);
            totalScore += evaluateKingSafety(g);
            totalScore += evaluatePawnStructure(g);
            totalScore += evaluatePassedPawns(g);

            // ⭐ thêm áp lực lên vua
            totalScore += controlNearKing(g);

            return totalScore;
        }

        function aiMove() {

            if (aiThinking) return;

            aiThinking = true;

            const startTime = Date.now();
            const MAX_TIME = 7000; // AI bắt buộc đánh trong 7s

            const myThinkID = ++aiThinkID;

            let moves = game.moves({ verbose: true });

            if (moves.length === 0) {
                aiThinking = false;
                return;
            }

            let i = 0;
            let bestMove = null;
            let bestScore = -Infinity;

            function think() {

                if (myThinkID !== aiThinkID) {
                    aiThinking = false;
                    return;
                }

                const frameStart = performance.now();

                while (i < moves.length) {

                    // giới hạn mỗi frame chỉ tính tối đa ~5ms
                    if (performance.now() - frameStart > 5) {
                        setTimeout(think, 0);
                        return;
                    }

                    // hết thời gian phải đánh ngay
                    if (Date.now() - startTime > MAX_TIME) {

                        aiThinking = false;

                        if (game.turn() !== myColor) {

                            executeMove(
                                bestMove || moves[Math.floor(Math.random() * moves.length)]
                            );

                        }

                        return;
                    }

                    let move = moves[i];

                    game.move(move);

                    let score = 0;

                    try {
                        score = minimax(game, 1, -Infinity, Infinity) || 0;
                    } catch (e) {
                        score = 0;
                    }

                    if (typeof calculateTacticalScore === "function")
                        score += calculateTacticalScore(move, game);

                    if (typeof evaluatePosition === "function")
                        score += evaluatePosition(move, game);

                    game.undo();

                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = move;
                    }

                    i++;
                }

                aiThinking = false;

                if (game.turn() !== myColor) {

                    executeMove(
                        bestMove || moves[Math.floor(Math.random() * moves.length)]
                    );

                }

            }

            setTimeout(think, 0);
        }

        function calculateTacticalScore(move, g) {

            let score = 0;

            const attackerVal = pieceValues[move.piece];
            const victimVal = move.captured ? pieceValues[move.captured] : 0;

            let tempGame = new Chess(g.fen());
            tempGame.move(move);

            tempGame.load(tempGame.fen());
            const opponentMoves = tempGame.moves({ verbose: true });

            const attackers = opponentMoves.filter(m => m.to === move.to);

            const isAttacked = attackers.length > 0;

            // ===== CAPTURE =====
            if (move.captured) {

                const gain = victimVal - attackerVal;

                if (!isAttacked) {

                    // ăn an toàn
                    score += victimVal * 40;

                } else {

                    if (gain > 0) {

                        // trade lời
                        score += gain * 35;

                    } else {

                        // trade lỗ
                        score -= Math.abs(gain) * 250;

                    }

                }

            }

            // ===== MOVE INTO DANGER =====
            if (!move.captured && isAttacked) {

                score -= attackerVal * 220;

            }

            return score;
        }

        function evaluatePosition(move, currentGame) {

            let score = 0;

            // ===== PAWN ADVANCE =====
            if (move.piece === 'p') {

                score += 80;

                const row = parseInt(move.to[1]);

                if (move.color === 'b')
                    score += (8 - row) * 20;
                else
                    score += row * 20;

            }

            // ===== PROTECTION BONUS =====
            if (isSquareProtected(move.to, currentGame, move.color)) {

                score += 40;

            }

            return score;
        }

        function findKing(color, g) {

            const board = g.board();

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {

                    if (board[i][j] && board[i][j].type === 'k' && board[i][j].color === color) {

                        return String.fromCharCode(97 + j) + (8 - i);

                    }
                }
            }

            return null;
        }

        function controlNearKing(g) {

            let bonus = 0;

            const aiColor = (myColor === 'w') ? 'b' : 'w';
            const enemyColor = aiColor === 'w' ? 'b' : 'w';

            const kingSq = findKing(enemyColor, g);

            if (!kingSq) return 0;

            // clone game để lấy đúng lượt của AI
            let temp = new Chess(g.fen());
            temp._turn = aiColor;

            const moves = temp.moves({ verbose: true });

            moves.forEach(m => {

                const distance =
                    Math.abs(m.to.charCodeAt(0) - kingSq.charCodeAt(0)) +
                    Math.abs(m.to.charCodeAt(1) - kingSq.charCodeAt(1));

                if (distance <= 2) bonus += 60;

            });

            return bonus;
        }

        // Hàm kiểm tra ô có bị tấn công không (để tránh đưa quân quan trọng vào chỗ chết)
        function isSquareAttacked(sq, g) {
            // Lấy tất cả các nước đi có thể của phe đang cầm lượt
            const moves = g.moves({ verbose: true });
            // Nếu có bất kỳ nước đi nào của đối phương có thể đi tới ô 'sq'
            // Chứng tỏ ô này đang bị tấn công.
            return moves.some(m => m.to === sq);
        }

        // Kiểm tra xem quân cờ đi tới đó có được quân khác bảo vệ không (tấn công có tổ chức)
        function isSquareProtected(square, g, color) {

            const board = g.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {

                    const piece = board[r][c];
                    if (!piece || piece.color !== color) continue;

                    const from = String.fromCharCode(97 + c) + (8 - r);

                    const moves = g.moves({ square: from, verbose: true });

                    if (moves.some(m => m.to === square)) {
                        return true;
                    }
                }
            }

            return false;
        }

        function executeMove(move, isAuto = false) {
            aiThinking = false;
            aiThinkID++;

            const m = game.move(move);
            if (!m) return;

            // Nếu người chơi tự đánh (không phải Auto và đúng màu của mình)
            if (!isAuto && m.color === myColor) {
                afkCount = 0; // Thoát khỏi trạng thái AFK, reset bộ đếm
            }

            board.position(game.fen(), true);

            if (mode === 'PVP' && window.currentRoom) {
                sendMove(m);
            }

            const role = (m.color === myColor) ? 'user' : 'opponent';
            const pieceNames = { 'p': 'Tốt', 'n': 'Mã', 'b': 'Tượng', 'r': 'Xe', 'q': 'Hậu', 'k': 'Vua' };
            const colorName = (m.color === 'w' ? 'TRẮNG' : 'ĐEN');

            let moveMsg = `<b>[${colorName}]</b> ${pieceNames[m.piece]} ${m.from}→${m.to}`;
            if (m.captured) moveMsg += ` <span style="color:#ff4444;">(Ăn ${pieceNames[m.captured]})</span>`;

            addLog(moveMsg, role);

            if (m.flags.includes('p') || m.promotion) {
                const promoPiece = pieceNames[m.promotion] || "Hậu";
                addLog(`CẢNH BÁO: TỐT [${colorName}] TẠI ${m.to} ĐÃ PHONG ${promoPiece.toUpperCase()}`, 'system');
            }

            startCountdown();
            selectedSq = null;
            $('.click-cell').removeClass('border-selected border-hint');
            refreshStatus();

            if (mode === 'PVE' && game.turn() !== myColor) {
                setTimeout(aiMove, 500);
            }
        }

        function refreshStatus() {
            $('.click-cell').removeClass('in-check');
            $('#turn-display').text("LƯỢT: " + (game.turn() === 'w' ? "TRẮNG" : "ĐEN"));

            if (game.in_check()) {
                const kingPos = findKing(game.turn(), game);
                $(`#sq-${kingPos}`).addClass('in-check');
                if (!game.in_checkmate()) {
                    addLog(`CẢNH BÁO: QUÂN ${game.turn() === 'w' ? 'TRẮNG' : 'ĐEN'} ĐANG BỊ CHIẾU!`, 'system');
                }
            }

            if (game.game_over()) {
                clearInterval(timerInt);
                let msg = "";
                if (game.in_checkmate()) {
                    let winner = (game.turn() === 'w' ? "ĐEN" : "TRẮNG");
                    msg = `CHIẾU BÍ! QUÂN ${winner} CHIẾN THẮNG.`;
                } else {
                    msg = "HÒA CỜ!";
                }

                // Đồng bộ kết quả chiếu bí lên Firebase
                if (mode === 'PVP' && window.currentRoom) {
                    db.ref('rooms/' + window.currentRoom).update({
                        gameOver: true,
                        reason: msg,
                        updated: Date.now()
                    });
                }

                addLog(`HẾT TRẬN: ${msg}`, 'system');
                triggerModal(msg, [{ txt: "Quay lại", fn: "exitGame()" }], "KẾT THÚC");
            }
        }

        function findKingBroad(c) {
            // Duyệt qua toàn bộ 64 ô của bàn cờ (8x8)
            for (let i = 0; i < 8; i++)
                for (let j = 0; j < 8; j++) {
                    let s = String.fromCharCode(97 + j) + (i + 1); // Chuyển chỉ số i, j thành tọa độ cờ (a1, b2...)
                    let p = game.get(s); // Lấy thông tin quân cờ tại ô đó
                    // Nếu là quân Vua ('k') và đúng màu cần tìm ('w' hoặc 'b') thì trả về tọa độ
                    if (p && p.type === 'k' && p.color === c) return s;
                }
        }

        function startCountdown() {
            if (timerInt) clearInterval(timerInt);

            let duration = 30000;
            let startTime = Date.now();

            timerInt = setInterval(() => {
                if (game.game_over() || isPaused) return;

                let elapsed = Date.now() - startTime;
                let remaining = duration - elapsed;
                let sec = Math.ceil(remaining / 1000);

                if (sec <= 0) {
                    sec = 0;
                    clearInterval(timerInt);

                    let currentTurnColor = game.turn();
                    let colorName = (currentTurnColor === 'w' ? "TRẮNG" : "ĐEN");

                    // Không ghi log thông báo hết giờ thông thường ở đây nữa

                    if (currentTurnColor === myColor) {
                        afkCount++;

                        // Gửi tín hiệu AFK thầm lặng lên Firebase để đồng bộ logic đếm
                        if (mode === 'PVP' && window.currentRoom) {
                            db.ref('rooms/' + window.currentRoom).update({
                                afkSignal: {
                                    color: colorName,
                                    count: afkCount,
                                    ts: Date.now()
                                }
                            });
                        }

                        // Kiểm tra điều kiện dừng trận (3 lần)
                        if (afkCount >= MAX_AFK) {
                            let loseMsg = `QUÂN ${colorName} NGỪNG HOẠT ĐỘNG. XỬ THUA DO AFK ${MAX_AFK} LẦN LIÊN TIẾP!`;
                            if (mode === 'PVP' && window.currentRoom) {
                                db.ref('rooms/' + window.currentRoom).update({
                                    gameOver: true,
                                    reason: loseMsg,
                                    updated: Date.now()
                                });
                            }
                            addLog(loseMsg, 'system'); // Giữ lại thông báo dừng trận quan trọng này
                            triggerModal(loseMsg, [{ txt: "Thoát", fn: "exitGame()" }], "DỪNG TRẬN ĐẤU");
                            return;
                        }
                    }

                    // Tự động đánh để tiếp tục trận đấu
                    let moves = game.moves();
                    if (moves.length > 0) {
                        executeMove(moves[Math.floor(Math.random() * moves.length)], true);
                    }
                }
                $('#timer-span').text(sec + "s");
            }, 100);
        }

        function fastHash(g, depth) {

            let fen = g.fen().split(" ").slice(0, 4).join(" ");

            let hash = 0;

            for (let i = 0; i < fen.length; i++) {
                hash = ((hash << 5) - hash) + fen.charCodeAt(i);
                hash |= 0;
            }

            return hash + "_" + depth;
        }

        function evaluateMobility(g) {

            const aiColor = (myColor === 'w') ? 'b' : 'w';
            const enemyColor = aiColor === 'w' ? 'b' : 'w';

            let aiMoves = 0;
            let enemyMoves = 0;

            let aiGame = new Chess(g.fen());
            aiGame._turn = aiColor;
            aiMoves = aiGame.moves().length;

            let enemyGame = new Chess(g.fen());
            enemyGame._turn = enemyColor;
            enemyMoves = enemyGame.moves().length;

            return (aiMoves - enemyMoves) * 4;
        }

        function evaluateKingSafety(g) {

            let score = 0;

            const aiColor = (myColor === 'w') ? 'b' : 'w';
            const enemyColor = aiColor === 'w' ? 'b' : 'w';

            // vua AI bị chiếu
            if (g.in_check() && g.turn() === aiColor) {
                score -= 150;
            }

            // vua đối thủ bị chiếu
            if (g.in_check() && g.turn() === enemyColor) {
                score += 150;
            }

            const enemyKing = findKing(enemyColor, g);

            if (enemyKing) {

                const file = enemyKing.charCodeAt(0) - 97;
                const rank = parseInt(enemyKing[1]);

                // vua đứng giữa dễ bị tấn công
                if (file >= 3 && file <= 4 && rank >= 3 && rank <= 6) {
                    score += 40;
                }

            }

            return score;
        }

        function evaluatePawnStructure(g) {

            const board = g.board();
            let score = 0;

            const aiColor = (myColor === 'w') ? 'b' : 'w';

            for (let j = 0; j < 8; j++) {

                let whitePawns = 0;
                let blackPawns = 0;

                for (let i = 0; i < 8; i++) {

                    let piece = board[i][j];

                    if (piece && piece.type === "p") {

                        if (piece.color === aiColor) {
                            score += 6;
                        } else {
                            score -= 6;
                        }

                        if (piece.color === "w") whitePawns++;
                        else blackPawns++;

                    }

                }

                // pawn chồng
                if (whitePawns > 1) score -= 10 * (whitePawns - 1);
                if (blackPawns > 1) score += 10 * (blackPawns - 1);

            }

            return score;
        }

        function evaluatePassedPawns(g) {

            const board = g.board();
            let score = 0;

            const aiColor = (myColor === 'w') ? 'b' : 'w';

            for (let i = 0; i < 8; i++) {

                for (let j = 0; j < 8; j++) {

                    let piece = board[i][j];

                    if (!piece || piece.type !== "p") continue;

                    let isPassed = true;

                    for (let r = i + 1; r < 8; r++) {

                        for (let c = j - 1; c <= j + 1; c++) {

                            if (c < 0 || c > 7) continue;

                            let p = board[r][c];

                            if (p && p.type === "p" && p.color !== piece.color) {
                                isPassed = false;
                                break;
                            }

                        }

                        if (!isPassed) break;
                    }

                    if (isPassed) {

                        if (piece.color === aiColor)
                            score += (7 - i) * 15;
                        else
                            score -= (7 - i) * 15;

                    }

                }

            }

            return score;
        }

        function quiescence(g, alpha, beta, depth = 0) {

            if (depth > 6) return evaluateBoard(g);   // ⭐ GIỚI HẠN

            let stand = evaluateBoard(g);

            if (stand >= beta) return beta;

            if (alpha < stand)
                alpha = stand;

            let moves = g.moves({ verbose: true })
                .filter(m => m.captured);

            for (let m of moves) {

                g.move(m);

                let score = -quiescence(g, -beta, -alpha, depth + 1);

                g.undo();

                if (score >= beta) return beta;

                if (score > alpha)
                    alpha = score;
            }

            return alpha;
        }

        $(document).on('click', '.click-cell', function () {

            if (game.turn() !== myColor || isPaused) return;

            const sq = $(this).attr('data-sq');

            if (selectedSq) {

                const move = game.moves({ square: selectedSq, verbose: true })
                    .find(m => m.to === sq);

                if (move) {

                    executeMove(move);

                    selectedSq = null;
                    $('.click-cell').removeClass('border-selected border-hint');

                } else {

                    selectPiece(sq);

                }

            } else {

                selectPiece(sq);

            }

        });

        function selectPiece(sq) {
            const p = game.get(sq);
            // Kiểm tra: ô có quân không? có phải quân của mình không? có đúng lượt không?
            if (p && p.color === myColor && p.color === game.turn()) {
                selectedSq = sq;
                $('.click-cell').removeClass('border-selected border-hint'); // Xóa dấu vết cũ
                $(`#sq-${sq}`).addClass('border-selected'); // Làm nổi bật quân đang chọn

                // Tìm tất cả các nước đi hợp lệ từ quân này và hiển thị gợi ý (hint) lên các ô đích
                game.moves({ square: sq, verbose: true }).forEach(m => $(`#sq-${m.to}`).addClass('border-hint'));
            }
        }

        // Vẽ một lớp ô vuông trong suốt đè lên bàn cờ để bắt sự kiện click
        function drawClickGrid() {
            $('#click-overlay').empty();
            let sqs = [];
            // Tạo danh sách 64 ô từ a8 đến h1
            for (let i = 8; i >= 1; i--) for (let j = 0; j < 8; j++) sqs.push(String.fromCharCode(97 + j) + i);
            // Nếu chơi quân Đen, đảo ngược bàn cờ để nhìn từ dưới lên
            if (myColor === 'b') sqs.reverse();
            sqs.forEach(s => $('#click-overlay').append(`<div class="click-cell" id="sq-${s}" data-sq="${s}"></div>`));
        }

        function initGame(m) {
            mode = m; // 'PVE' (Máy) hoặc 'PVP' (Người)
            game.reset(); // Làm mới dữ liệu bàn cờ
            aiRecentSquares = [];

            if (m === 'PVE') {
                myColor = Math.random() > 0.5 ? 'w' : 'b'; // Ngẫu nhiên chọn màu
                addLog(`CHẾ ĐỘ: NGƯỜI VS MÁY - Bạn cầm quân ${myColor === 'w' ? 'TRẮNG' : 'ĐEN'}`, 'system');
            } else {
                addLog(`CHẾ ĐỘ: NGƯỜI VS NGƯỜI - Trận đấu bắt đầu!`, 'system');
            }

            board.orientation(myColor === 'w' ? 'white' : 'black'); // Xoay bàn cờ theo màu
            board.start(); // Hiển thị quân cờ
            drawClickGrid(); // Vẽ lớp click
            closeSystemModal(); // Đóng các bảng thông báo
            refreshStatus(); // Cập nhật trạng thái lượt đi

            // Nếu chơi với máy và máy đi trước (mình là Đen), kích hoạt máy đi sau 1 giây
            if (myColor === 'b' && m === 'PVE') setTimeout(aiMove, 1000);

            for (let k in transTable) delete transTable[k];
            startCountdown();
        }

        function exitGame() {
            // Xóa dữ liệu chờ và phòng trên Firebase khi thoát
            db.ref('matchmaking/' + myId).remove();
            if (window.currentRoom) db.ref('rooms/' + window.currentRoom).remove();
            location.reload(); // Tải lại trang
        }

        board = Chessboard('board', {
            position: 'start',
            draggable: false,
            moveSpeed: 80,
            snapSpeed: 60,
            snapbackSpeed: 60,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        window.addEventListener('resize', () => {
            setTimeout(() => {
                board.resize();
                drawClickGrid();
            }, 100);
        });
    </script>
