<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <title>CHESS MASTER PURPLE - ULTIMATE AI</title>
    <style>
        :root {
            --primary-glow: #a29bfe;
            --secondary-glow: #6c5ce7;
            --warning-gold: #f1c40f;
            --danger-red: #ff4757;
            --bg-dark: #0f0a1e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-shadow: 0 0 15px rgba(162, 155, 254, 0.6), 0 0 30px rgba(108, 92, 231, 0.4);
        }

        body {
            background: radial-gradient(circle at center, #1e1433 0%, #0f0a1e 100%);
            color: #efedff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.4s ease;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        .logo-container {
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px var(--primary-glow));
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            from {
                filter: drop-shadow(0 0 10px var(--primary-glow));
            }

            to {
                filter: drop-shadow(0 0 25px var(--secondary-glow));
            }
        }

        .game-title {
            font-size: 3.5em;
            font-weight: 900;
            margin-bottom: 40px;
            background: linear-gradient(to bottom, #fff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 6px;
            filter: drop-shadow(0 0 20px rgba(108, 92, 231, 0.9));
            text-align: center;
            line-height: 1;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 300px;
            align-items: stretch;
        }

        .menu-btn {
            background: linear-gradient(45deg, #6c5ce7, #8e44ad);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 18px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: var(--neon-shadow);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

            .menu-btn:hover {
                transform: scale(1.05);
                box-shadow: 0 0 25px var(--primary-glow);
                border-color: #fff;
                filter: brightness(1.2);
            }

        #game-view-container {
            display: none;
            padding: 15px;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            height: 100vh;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        #game-outer {
            width: 450px;
            max-width: 100%;
        }

        .board-wrapper {
            position: relative;
            padding: 8px;
            background: #2d2342;
            border: 2px solid var(--secondary-glow);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.4);
        }

        .info-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #side-panel {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 520px;
        }

        #logs {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            font-family: 'Consolas', monospace;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            font-size: 11px;
            line-height: 1.6;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .log-entry {
            margin-bottom: 6px;
            padding-bottom: 3px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            text-align: left;
        }

        .log-white {
            color: #ffffff;
            font-weight: bold;
        }

        .log-black {
            color: #d1d1ff;
            font-weight: bold;
        }

        .log-sys {
            color: #a29bfe;
            font-style: italic;
            background: rgba(162, 155, 254, 0.08);
            padding: 6px;
            border-radius: 6px;
            border-left: 3px solid var(--primary-glow);
            margin: 5px 0;
        }

        .log-thinking {
            color: #888;
            font-size: 10px;
            padding-left: 10px;
            font-style: italic;
        }

        .log-warning {
            color: var(--warning-gold);
            font-weight: 900;
            background: rgba(241, 196, 15, 0.1);
            border: 1px solid var(--warning-gold);
            padding: 5px;
            border-radius: 4px;
            text-transform: uppercase;
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            from {
                opacity: 0.7;
                box-shadow: 0 0 0px var(--warning-gold);
            }

            to {
                opacity: 1;
                box-shadow: 0 0 10px var(--warning-gold);
            }
        }

        .log-time-sync {
            color: #888;
            font-family: monospace;
            font-size: 10px;
            margin-right: 8px;
        }

        #custom-modal, #promotion-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 15, 35, 0.98);
            backdrop-filter: blur(25px);
            padding: 25px 20px; /* Thu nhỏ padding để không bị tràn */
            border-radius: 20px;
            border: 2px solid var(--primary-glow);
            z-index: 2000;
            text-align: center;
            display: none;
            width: 85%; /* Sử dụng % để tự thích ứng với điện thoại */
            max-width: 380px;
            box-sizing: border-box; /* Đảm bảo padding không làm phình kích thước */
            box-shadow: 0 0 100px rgba(0,0,0,0.9), 0 0 30px var(--secondary-glow);
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1999;
        }

        .modal-btn {
            background: linear-gradient(45deg, #6c5ce7, #8e44ad);
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .border-selected {
            background: rgba(162, 155, 254, 0.3) !important;
            border: 2px solid var(--primary-glow);
            box-sizing: border-box;
        }

        .border-hint {
            background: rgba(162, 155, 254, 0.4) !important;
            border: 2px dashed #a29bfe !important;
        }

        .check-square {
            box-shadow: inset 0 0 25px rgba(255, 71, 87, 0.8) !important;
            background: rgba(255, 71, 87, 0.15) !important;
        }

        .check-blink {
            animation: king-blink 0.6s infinite alternate !important;
            filter: drop-shadow(0 0 8px #ff4757) !important;
        }

        .promo-option {
            display: inline-block;
            width: 60px;
            height: 60px;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

            .promo-option:hover {
                transform: scale(1.2);
                background: rgba(162, 155, 254, 0.3);
            }

            .promo-option img {
                width: 100%;
            }

        @keyframes king-blink {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0.3;
                transform: scale(0.85);
            }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #game-view-container {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                padding: 5px; /* Thu nhỏ khoảng cách lề */
                gap: 10px; /* Thu nhỏ khoảng cách giữa bàn cờ và log */
                height: 100vh;
            }

            #game-outer {
                width: 100%;
                order: 1;
            }

            .board-wrapper {
                padding: 3px;
                width: 90vw; /* Thu nhỏ bàn cờ lại một chút */
                max-width: 400px;
                margin: 0 auto;
            }

            #side-panel {
                width: 90vw; /* Đồng bộ chiều rộng với bàn cờ */
                max-width: 400px;
                flex-grow: 1;
                max-height: 35vh; /* Giới hạn chiều cao bảng log để không đẩy nút thoát xuống quá sâu */
                order: 2;
            }

            #logs {
                font-size: 10px; /* Thu nhỏ chữ log một chút */
            }

            .game-title {
                font-size: 2em; /* Thu nhỏ tiêu đề */
            }

            .click-cell, .board-b72b1 {
                touch-action: manipulation;
            }
        }

        #click-overlay {
            position: absolute;
            top: 8px;
            left: 8px;
            width: calc(100% - 16px);
            height: calc(100% - 16px);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            z-index: 100;
        }

        #board {
            position: relative;
        }

        .click-cell {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.01);
            box-sizing: border-box;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="modal-overlay"></div>
    <div id="custom-modal">
        <h2 id="modal-title" style="margin-top:0; color:var(--primary-glow); letter-spacing: 2px;">HỆ THỐNG</h2>
        <p id="modal-msg" style="font-size: 1.2em; margin: 25px 0; font-weight: 600; line-height: 1.4;"></p>
        <div id="modal-btns"></div>
    </div>

    <div id="screen-intro" class="screen">
        <div class="logo-container">
            <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            </svg>
        </div>
        <div class="game-title">CHESS MASTER<br>PURPLE</div>
        <div class="btn-container">
            <button class="menu-btn" onclick="switchScreen('screen-start')">BẮT ĐẦU</button>
        </div>

    <div id="screen-start" class="screen hidden">
        <div class="game-title" style="font-size: 2.5em;">CHỌN CHẾ ĐỘ</div>
        <div class="btn-container">
            <button class="menu-btn" onclick="switchScreen('screen-difficulty')">ĐẤU VỚI MÁY</button>
            <button class="menu-btn" onclick="requestGame('PVP')">ĐẤU 2 NGƯỜI (ONLINE)</button>
            <button class="menu-btn" style="opacity:0.6; font-size: 12px;" onclick="switchScreen('screen-intro')">QUAY LẠI</button>
        </div>
    </div>

    <div id="screen-difficulty" class="screen hidden">
        <div class="game-title" style="font-size: 2em;">ĐỘ KHÓ AI</div>
        <div class="btn-container">
            <button class="menu-btn" onclick="startGameAI(2)">DỄ (Depth 2)</button>
            <button class="menu-btn" onclick="startGameAI(3)">TRUNG BÌNH (Depth 3)</button>
            <button class="menu-btn" onclick="startGameAI(4)">KHÓ (Depth 4)</button>
            <button class="menu-btn" style="opacity:0.6; font-size: 12px;" onclick="switchScreen('screen-start')">QUAY LẠI</button>
        </div>
    </div>

    <div id="game-view-container">
        <div id="game-outer">
            <div class="info-bar">
                <span id="turn-display" style="font-size:1.2em; font-weight:bold; letter-spacing:1px; color: var(--primary-glow)">LƯỢT: TRẮNG</span>
            </div>
            <div class="board-wrapper">
                <div id="board"></div>
                <div id="click-overlay"></div>
            </div>
        </div>

        <div id="side-panel">
            <div id="logs"></div>
            <button class="menu-btn" style="background: linear-gradient(45deg, #ff4757, #ff6b81); box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);" onclick="confirmExit()">THOÁT TRẬN</button>
        </div>
    </div>

    <div id="promotion-menu">
        <h3 style="color: var(--primary-glow); margin-bottom: 15px;">CHỌN QUÂN PHONG CẤP</h3>
        <div id="promo-options">
            <div class="promo-option" data-piece="q"><img src="" alt="Queen"></div>
            <div class="promo-option" data-piece="r"><img src="" alt="Rook"></div>
            <div class="promo-option" data-piece="b"><img src="" alt="Bishop"></div>
            <div class="promo-option" data-piece="n"><img src="" alt="Knight"></div>
        </div>
    </div>

    <script>
        // === CẤU HÌNH FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyCJRXRhYXBbc0DiwZg3KXnySGJ63z4Ow2s",
            authDomain: "chessonline-43534.firebaseapp.com",
            databaseURL: "https://chessonline-43534-default-rtdb.firebaseio.com",
            projectId: "chessonline-43534",
            storageBucket: "chessonline-43534.firebasestorage.app",
            messagingSenderId: "194591877060",
            appId: "1:194591877060:web:4d9461cbebfc3184eb2691"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myId = "UID-" + Math.random().toString(36).substr(2, 5);

        // === BIẾN TOÀN CỤC CHUNG ===
        let board = null, game = new Chess();
        let myColor = 'w', isPaused = false, depthAI = 3;
        let mode = 'PVE', selectedSq = null;
        let aiThinking = false, aiThinkID = 0;
        let currentRoom = null, pendingMove = null, matchmakingTimer = null;
        let turnStartTime = performance.now();
        const pieceNames = { p: 'Tốt', n: 'Mã', b: 'Tượng', r: 'Xe', q: 'Hậu', k: 'Vua' };

        // === DỮ LIỆU ĐÁNH GIÁ AI ===
        const VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        const PAWN_PST = [
            0, 0, 0, 0, 0, 0, 0, 0,
            50, 50, 50, 50, 50, 50, 50, 50,
            10, 10, 20, 30, 30, 20, 10, 10,
            5, 5, 10, 25, 25, 10, 5, 5,
            0, 0, 0, 20, 20, 0, 0, 0,
            5, -5, -10, 0, 0, -10, -5, 5,
            5, 10, 10, -20, -20, 10, 10, 5,
            0, 0, 0, 0, 0, 0, 0, 0
        ];
        const KNIGHT_PST = [
            -50, -40, -30, -30, -30, -30, -40, -50,
            -40, -20, 0, 0, 0, 0, -20, -40,
            -30, 0, 10, 15, 15, 10, 0, -30,
            -30, 5, 15, 20, 20, 15, 5, -30,
            -30, 0, 15, 20, 20, 15, 0, -30,
            -30, 5, 10, 15, 15, 10, 5, -30,
            -40, -20, 0, 5, 5, 0, -20, -40,
            -50, -40, -30, -30, -30, -30, -40, -50
        ];
        const BISHOP_PST = [
            -20, -10, -10, -10, -10, -10, -10, -20,
            -10, 0, 0, 0, 0, 0, 0, -10,
            -10, 0, 5, 10, 10, 5, 0, -10,
            -10, 5, 5, 10, 10, 5, 5, -10,
            -10, 0, 10, 10, 10, 10, 10, -10,
            -10, 10, 10, 10, 10, 10, 10, -10,
            -10, 5, 0, 0, 0, 0, 5, -10,
            -20, -10, -10, -10, -10, -10, -10, -20
        ];
        const ROOK_PST = [
            0, 0, 0, 5, 5, 0, 0, 0,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            -5, 0, 0, 0, 0, 0, 0, -5,
            5, 10, 10, 10, 10, 10, 10, 5,
            0, 0, 0, 0, 0, 0, 0, 0
        ];
        const QUEEN_PST = [
            -20, -10, -10, -5, -5, -10, -10, -20,
            -10, 0, 0, 0, 0, 0, 0, -10,
            -10, 0, 5, 5, 5, 5, 0, -10,
            -5, 0, 5, 5, 5, 5, 0, -5,
            0, 0, 5, 5, 5, 5, 0, -5,
            -10, 5, 5, 5, 5, 5, 0, -10,
            -10, 0, 5, 0, 0, 0, 0, -10,
            -20, -10, -10, -5, -5, -10, -10, -20
        ];
        const KING_PST = [
            -30, -40, -40, -50, -50, -40, -40, -30,
            -30, -40, -40, -50, -50, -40, -40, -30,
            -30, -40, -40, -50, -50, -40, -40, -30,
            -30, -40, -40, -50, -50, -40, -40, -30,
            -20, -30, -30, -40, -40, -30, -30, -20,
            -10, -20, -20, -20, -20, -20, -20, -10,
            20, 20, 0, 0, 0, 0, 20, 20,
            20, 30, 10, 0, 0, 10, 30, 20
        ];

        const PSTs = {
            p: PAWN_PST, n: KNIGHT_PST, b: BISHOP_PST,
            r: ROOK_PST, q: QUEEN_PST, k: KING_PST
        };

        let transpositionTable = new Map();
        let killerMoves = new Array(10).fill(null).map(() => ({ 1: null, 2: null }));
        let historyTable = new Map();
        const TT_EXACT = 0, TT_LOWERBOUND = 1, TT_UPPERBOUND = 2;

        // === UI & GIAO DIỆN ===
        function switchScreen(id) {
            $('.screen').addClass('hidden');
            $('#game-view-container').hide();
            if (id === 'game-view-container') $('#game-view-container').css('display', 'flex');
            else $('#' + id).removeClass('hidden');
        }

        function triggerModal(msg, btns, title = "HỆ THỐNG") {
            isPaused = true;
            $('#modal-title').text(title);
            $('#modal-msg').html(msg);
            $('#modal-btns').html(btns.map(x => `<button class="modal-btn" onclick="${x.fn}">${x.txt}</button>`).join(''));
            $('#modal-overlay, #custom-modal').fadeIn();
        }

        function closeSystemModal() {
            $('#modal-overlay, #custom-modal').fadeOut();
            if (matchmakingTimer) {
                clearInterval(matchmakingTimer);
                matchmakingTimer = null;
                db.ref('matchmaking/' + myId).remove();
                db.ref('rooms/' + myId).remove();
            }
            isPaused = false;

            // Nếu đến lượt máy mà máy đang đứng im, kích hoạt lại
            if (mode === 'PVE' && game.turn() !== myColor && !aiThinking) {
                aiThinkID++; // Hủy các tiến trình cũ
                setTimeout(startAiChunking, 200);
            }
        }

        function confirmExit() {
            triggerModal("Bạn có thực sự muốn thoát trận không?", [
                { txt: "Thoát", fn: "exitGame()" },
                { txt: "Ở lại", fn: "closeSystemModal()" }
            ], "XÁC NHẬN");
        }

        function exitGame() {
            db.ref('matchmaking/' + myId).remove();
            if (window.currentRoom) db.ref('rooms/' + window.currentRoom).remove();
            location.reload();
        }

        function addLog(msg, type = 'log-sys') {
            const now = new Date();
            const timeStr = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
            $('#logs').append(`<div class="log-entry"><span class="log-time-sync">${timeStr}</span><span class="${type}">${msg}</span></div>`);
            const $logs = $('#logs');
            $logs.scrollTop($logs[0].scrollHeight);
        }

        function drawClickGrid() {
            const $overlay = $('#click-overlay').empty();
            if (!board) return;

            const isWhite = (board.orientation() === 'white');
            const ranks = isWhite ? [8, 7, 6, 5, 4, 3, 2, 1] : [1, 2, 3, 4, 5, 6, 7, 8];

        function startGamePVP(roomId) {
            window.currentRoom = roomId;
            let lastUpdate = 0;

            db.ref('rooms/' + roomId).on('value', snap => {
                const data = snap.val();
                if (!data || !data.fen) return;

                // Xử lý khi có tín hiệu kết thúc trận từ server
                if (data.gameOver && !isPaused) {
                    triggerModal(data.reason, [{ txt: "Thoát", fn: "exitGame()" }], "KẾT THÚC");
                    return;
                }

                if (data.updated === lastUpdate) return;
                lastUpdate = data.updated;

                // Logic dịch ngược FEN từ thử_file.html để bắt chính xác nước đi
                if (data.fen !== game.fen() && data.fen !== 'start') {
                    let oldFen = game.fen();

                    // Tạo bàn cờ ảo để truy vết
                    let tempGame = new Chess(oldFen);
                    let moves = tempGame.moves({ verbose: true });
                    let foundMove = null;

                    for (let m of moves) {
                        tempGame.move(m);
                        if (tempGame.fen() === data.fen) {
                            foundMove = m;
                            break;
                        }
                        tempGame.undo();
                    }

                    // Đồng bộ bàn cờ chính
                    game.load(data.fen);
                    board.position(data.fen);

                    // Ghi log chi tiết nếu tìm thấy nước đi

                        let pName = pieceNames[foundMove.piece];

                        // Tính Eval như người chơi

                        let scoreStr = (Math.abs(currentScore) > 10000) ? (currentScore < 0 ? "-MATE" : "+MATE") : (currentScore >= 0 ? `+${(currentScore / 100).toFixed(2)}` : `${(currentScore / 100).toFixed(2)}`);

                        let msg = `> ĐỐI THỦ ĐÁNH: ${pName} (${foundMove.from}→${foundMove.to}) | Eval: ${scoreStr}`;

                        }

                        updateCheckVisuals();

                        // --- UPDATE: Thông báo lượt tiếp theo cho PVP ---
                        if (!game.game_over()) {
                            const nextTurnColor = (game.turn() === 'w') ? 'TRẮNG' : 'ĐEN';
                            const turnName = (game.turn() === myColor) ? 'Người chơi' : 'Đối thủ';
                            addLog(`👤 Lượt ${turnName} [${nextTurnColor}]`, 'log-sys');

            setTimeout(() => { initGame('PVP'); }, 200);

        function executeMove(move) {

                if (mode === 'PVP' && window.currentRoom) db.ref('rooms/' + window.currentRoom).update({ gameOver: true, reason: msg, updated: Date.now() });

        // === BỘ NÃO AI ĐƯỢC CHUẨN HÓA LẠI TƯƠNG THÍCH NEGAMAX ===
        function evaluatePosition(g) {
            // Trong Negamax, nếu bên đang xét bị chiếu bí, thì điểm số là Âm vô cực (Thua cờ)
            if (g.in_checkmate()) return -Infinity;
            if (g.in_draw()) return 0;

            let score = 0;
            const b = g.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = b[r][c];
                    if (!piece) continue;

                    let val = VALUES[piece.type];
                    let pstVal = 0;

                    if (PSTs[piece.type]) {
                        let pstIndex = r * 8 + c;
                        if (piece.color === 'b') pstIndex = (7 - r) * 8 + c;
                        pstVal = PSTs[piece.type][pstIndex];
                    }

                    if (piece.color === 'w') score += (val + pstVal);
                    else score -= (val + pstVal);
                }
            }
            // Logic Fix Negamax: Điểm trả về phải đứng ở góc nhìn của phe ĐANG LÀM LƯỢT ĐI.
            return g.turn() === 'w' ? score : -score;
        }

        function getMoveScore(g, move, depth) {
            let score = 0;
            if (move.captured) {
                score = (10 * VALUES[move.captured]) - VALUES[move.piece];
            }
            if (killerMoves[depth] && (killerMoves[depth][1] === move.san || killerMoves[depth][2] === move.san)) {
                score += 1000;
            }
            const histKey = move.from + move.to;
            if (historyTable.has(histKey)) score += historyTable.get(histKey);
            if (move.flags.includes('p')) score += 900;
            return score;
        }

        function orderMoves(g, moves, depth) {
            return moves.map(m => ({ move: m, score: getMoveScore(g, m, depth) }))
                .sort((a, b) => b.score - a.score)
                .map(x => x.move);
        }

        function quiesce(g, alpha, beta, depth) {
            window.aiNodes = (window.aiNodes || 0) + 1;
            let stand_pat = evaluatePosition(g);
            if (stand_pat >= beta) {
                window.aiCutoffs = (window.aiCutoffs || 0) + 1;
                return beta;
            }
            if (alpha < stand_pat) alpha = stand_pat;
            if (depth > 4) return stand_pat;

            let moves = orderMoves(g, g.moves({ verbose: true }).filter(m => m.captured), 0);
            for (let move of moves) {
                g.move(move);
                let score = -quiesce(g, -beta, -alpha, depth + 1);
                g.undo();
                if (score >= beta) {
                    window.aiCutoffs = (window.aiCutoffs || 0) + 1;
                    return beta;
                }
                if (score > alpha) alpha = score;
            }
            return alpha;
        }

        function getHash(g) { return g.fen(); }

        async function startAiChunking() {
            if (aiThinking || isPaused || game.game_over()) return;
            aiThinking = true;

            const aiName = (myColor === 'w') ? 'ĐEN' : 'TRẮNG';
            // Đổi tiêu đề thông báo ngắn gọn hơn
            addLog(`🤖 Lượt Máy [${aiName}]: Depth=${depthAI}`, "log-sys");

            let currentThinkID = aiThinkID;
            window.aiNodes = 0;
            window.aiCutoffs = 0;

            try {
                let moves = orderMoves(game, game.moves({ verbose: true }), depthAI);
                let bestMove = moves[0];
                let finalEval = 0;

                for (let d = 1; d <= depthAI; d++) {
                    if (isPaused || currentThinkID !== aiThinkID) break;

                    let startNodes = window.aiNodes;
                    let startCutoffs = window.aiCutoffs;
                    let depthStart = performance.now();
                    let bestScoreThisDepth = -Infinity;
                    let bestMoveThisDepth = moves[0];

                    const result = await new Promise(resolve => {
                        let i = 0;
                        function process() {
                            if (isPaused || currentThinkID !== aiThinkID) { resolve(null); return; }
                            const start = performance.now();
                            while (i < moves.length && performance.now() - start < 50) {
                                let move = moves[i];
                                game.move(move);
                                let score = -minimax(game, d - 1, -Infinity, Infinity);
                                game.undo();
                                if (score > bestScoreThisDepth) {
                                    bestScoreThisDepth = score;
                                    bestMoveThisDepth = move;
                                }
                                i++;
                            }
                            if (i < moves.length) setTimeout(process, 10);
                            else resolve(bestMoveThisDepth);
                        }
                        process();
                    });

                    if (!result) break;
                    bestMove = result;
                    finalEval = bestScoreThisDepth;

                    let depthNodes = window.aiNodes - startNodes;
                    let depthCutoffs = window.aiCutoffs - startCutoffs;
                    let depthTime = (performance.now() - depthStart) / 1000;
                    let nps = Math.round(depthNodes / (depthTime || 0.001));
                    let displayScore = (Math.abs(bestScoreThisDepth) > 10000) ? (bestScoreThisDepth < 0 ? "-MATE" : "+MATE") : (bestScoreThisDepth / 100).toFixed(2);

                    let arrowIcon = `<span style="font-family: monospace; color: #a29bfe; margin-right: 6px;"> → </span>`;
                    let pNameD = pieceNames[bestMove.piece] || bestMove.piece;
                    addLog(`${arrowIcon} Depth ${d}: ${pNameD} (${bestMove.from}→${bestMove.to}) (Score ${displayScore} | Nodes: ${depthNodes} | NPS: ${nps}/s | Cutoffs: ${depthCutoffs})`, "log-thinking");

                    moves.sort((a, b) => (a === bestMove) ? -1 : (b === bestMove) ? 1 : 0);
                }

                aiThinking = false;
                if (!isPaused && currentThinkID === aiThinkID) {
                    let finalScoreStr = (Math.abs(finalEval) > 10000) ? (finalEval < 0 ? "-MATE" : "+MATE") : (finalEval / 100).toFixed(2);
                    let arrowIcon = `<span style="font-family: monospace; color: #a29bfe; margin-right: 6px;"> → </span>`;

                    // Lấy tên quân cờ và format đúng chuẩn cho dòng MÁY ĐÃ ĐÁNH
                    let pNameM = pieceNames[bestMove.piece] || bestMove.piece;

                    // --- CẬP NHẬT: Thêm hiển thị quân bị ăn cho AI ---
                    let captureStrAI = "";
                    if (bestMove.captured) {
                        captureStrAI = ` <span style="color:var(--danger-red);">(Ăn ${pieceNames[bestMove.captured]})</span>`;
                    }

                    addLog(`${arrowIcon}<span style="color: #00d2d3; font-weight: bold;"> MÁY ĐÃ ĐÁNH: ${pNameM} (${bestMove.from}→${bestMove.to}) | Eval: ${finalScoreStr}${captureStrAI}</span>`, "");
                    addLog(`${arrowIcon}<span style="color: #ff9f43; font-weight: bold;"> Thống kê: Nodes: ${window.aiNodes} | Cutoffs: ${window.aiCutoffs} | TT: ${transpositionTable.size}</span>`, "");

                    const finalMove = game.move(bestMove);
                    executeMove(finalMove);
                }
            } catch (e) {
                console.error(e);
                aiThinking = false;
            }
        }

        function minimax(g, depth, alpha, beta) {
            window.aiNodes = (window.aiNodes || 0) + 1;
            if (isPaused) return 0;
            const hash = getHash(g);
            if (transpositionTable.has(hash)) {
                let entry = transpositionTable.get(hash);
                if (entry.depth >= depth) return entry.score;
            }

            if (depth === 0) return quiesce(g, alpha, beta, 0);

            let moves = orderMoves(g, g.moves({ verbose: true }), depth);
            if (moves.length === 0) {
                return g.in_check() ? -Infinity : 0;
            }

            let bestScore = -Infinity;
            for (let move of moves) {
                g.move(move);
                let score = -minimax(g, depth - 1, -beta, -alpha);
                g.undo();

                if (score > bestScore) bestScore = score;
                if (score > alpha) alpha = score;
                if (alpha >= beta) {
                    window.aiCutoffs = (window.aiCutoffs || 0) + 1;
                    const histKey = move.from + move.to;
                    historyTable.set(histKey, (historyTable.get(histKey) || 0) + depth * depth);
                    break;
                }
            }
            transpositionTable.set(hash, { depth: depth, score: bestScore });
            return bestScore;

        }
    </script>
